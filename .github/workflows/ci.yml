name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Jest 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

  pipeline:
    name: 파이프라인 단위 테스트 (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # manifest 테스트는 stdlib만 사용 — 의존성 설치 불필요
      - run: python -m unittest discover -s pipeline -p "test_*.py" -v

  e2e:
    name: Playwright E2E (확장프로그램)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 확장프로그램 로드에는 풀 Chromium이 필요 (channel: 'chromium').
      # CI=true가 자동 설정되어 새 headless 모드로 실행된다 (playwright.config.js).
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: 실패 시 리포트/트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
