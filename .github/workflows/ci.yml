name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Jest 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint:js

      - run: npm test

  pipeline:
    name: 파이프라인 단위 테스트 (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - run: python -m pip install -r requirements-dev.txt

      - run: python -m ruff check pipeline scripts

      - run: python -m unittest discover -s pipeline -p "test_*.py" -v

      - name: Store release bundle clean-checkout 검증
        run: python scripts/package.py

  e2e:
    name: Playwright E2E (확장프로그램)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - run: npm ci

      # 확장프로그램 로드에는 풀 Chromium이 필요 (channel: 'chromium').
      # CI=true가 자동 설정되어 새 headless 모드로 실행된다 (playwright.config.js).
      - run: npx playwright install --with-deps chromium

      - name: 결정적 Store ZIP 생성
        run: python scripts/package.py

      - name: Store ZIP을 E2E용 임시 디렉터리에 추출
        shell: bash
        run: |
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          mkdir -p "$RUNNER_TEMP/bupgogae-store-package"
          python -m zipfile -e \
            "dist/bupgogae-${VERSION}.zip" \
            "$RUNNER_TEMP/bupgogae-store-package"

      - name: 실제 Store ZIP Playwright E2E
        run: npx playwright test
        env:
          BUPGOGAE_EXTENSION_PATH: ${{ runner.temp }}/bupgogae-store-package

      - name: 실패 시 리포트/트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
