name: Daily Crawler Pipeline

on:
  schedule:
    - cron: '0 15 * * *'  # KST 24:00 (UTC 15:00) 매일 실행
  workflow_dispatch:      # 수동 실행 지원

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      BUPGOGAE_API_KEY: ${{ secrets.BUPGOGAE_API_KEY }}
      KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      
    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v4

      - name: Python 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Python 및 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-crawler.txt

      - name: 데이터 디렉토리 생성
        run: mkdir -p pipeline/data

      - name: 기존 상태 파일(master.db) R2에서 다운로드
        run: python pipeline/sync_state.py download --dir ./pipeline/data

      - name: NAS 크롤러 실행 (판례, 헌재, 조세심판) 및 DB 덤프 R2 업로드
        run: python pipeline/nas_runner.py --data-dir ./pipeline/data

      - name: KIPRIS 특허심판 백필 실행 (선택적)
        run: python pipeline/kipris_runner.py --data-dir ./pipeline/data

      - name: 갱신된 상태 파일(master.db) R2에 업로드 백업
        if: always()
        run: python pipeline/sync_state.py upload --dir ./pipeline/data
        
      - name: 로그 및 데이터 디버그용 Artifact 업로드 (에러 시에만)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data-debug
          path: |
            pipeline/data/
            !pipeline/data/db*.json.gz
          retention-days: 7
