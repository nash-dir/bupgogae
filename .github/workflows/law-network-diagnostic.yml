name: Law Network Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-crawler.lock
      - name: Connect official WARP
        run: bash .github/scripts/connect-warp.sh
        env:
          CLOUDFLARE_WARP_TOS_ACCEPTED: ${{ vars.CLOUDFLARE_WARP_TOS_ACCEPTED }}
          WARP_ROUTE_MODE: proxy
      - name: Keyless law route comparison
        run: timeout --signal=TERM --kill-after=5s 240s python pipeline/network_diagnostics.py
      - name: Clean up ephemeral WARP
        if: always()
        continue-on-error: true
        run: |
          timeout 10s warp-cli --accept-tos --no-ansi disconnect || true
          timeout 10s warp-cli --accept-tos --no-ansi registration delete || true
          timeout 15s sudo systemctl stop warp-svc || true
