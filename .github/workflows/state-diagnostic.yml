name: Read-only State Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: '같은 저장소 main daily pipeline의 암호화 resume artifact 진단'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-crawler.lock'
      - name: 원본 실행의 저장소·main·workflow·SHA 검증
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]{1,32}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_bytes())
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['head_branch'] == 'main' and run['path'] == '.github/workflows/daily-pipeline.yml'
          assert run['status'] == 'completed' and re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crawler-resume-state-encrypted
          path: encrypted-state
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: 원본 실행 context로 인증 복호화 (R2/API credential 없음)
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          STATE_ARTIFACT_KEY: ${{ secrets.STATE_ARTIFACT_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'pipeline')
          from state_artifact import unseal
          os.environ['GITHUB_RUN_ID'] = os.environ['SOURCE_RUN_ID']
          os.environ['GITHUB_SHA'] = os.environ['SOURCE_SHA']
          unseal(Path('encrypted-state/resume.aead'), Path('diagnostic-state'), 'resume')
          print('authenticated diagnostic snapshot opened')
          PY
      - name: 읽기 전용 DB 진단 (공개 판례 필드·안전한 enum만 출력)
        run: python pipeline/diagnose_state.py --master diagnostic-state/master.db --output state-diagnostic.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state-diagnostic-public-report
          path: state-diagnostic.json
          retention-days: 1
