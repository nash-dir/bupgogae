<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>법고개 — Intelligent Document Reader</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <!-- ====================================================
       법고개 Intelligent Document Reader
       3-Pane Layout: 좌측(TOC) / 중앙(원문) / 우측(판례상세)
       ==================================================== -->

  <!-- 상단 툴바 -->
  <header class="viewer-toolbar" id="viewerToolbar">
    <div class="toolbar-left">
      <img src="../icons/icon48.png" alt="법고개" class="toolbar-logo" width="24" height="24">
      <h1 class="toolbar-title">Intelligent Document Reader</h1>
    </div>
    <div class="toolbar-center">
      <span class="toolbar-filename" id="toolbarFilename">파일을 드래그하여 업로드하세요</span>
    </div>
    <div class="toolbar-right">
      <span class="toolbar-stats" id="toolbarStats"></span>
      <button class="toolbar-btn" id="btnResetFile" title="파일 초기화" style="display:none;">
        <span class="toolbar-btn-icon">✕</span>
      </button>
    </div>
  </header>

  <!-- 3단 그리드 컨테이너 -->
  <main class="viewer-grid" id="viewerGrid">

    <!-- ──────── 좌측: 목차 패널 ──────── -->
    <aside class="panel panel-toc" id="panelToc">
      <div class="panel-header">
        <span class="panel-header-icon">📑</span>
        <span class="panel-header-title">목차</span>
      </div>
      <div class="panel-body" id="tocBody">
        <p class="panel-placeholder">문서를 업로드하면<br>목차가 표시됩니다.</p>
      </div>
    </aside>

    <!-- 좌-중 리사이저 -->
    <div class="resizer resizer-left" id="resizerLeft" title="드래그하여 크기 조정"></div>

    <!-- ──────── 중앙: 원문 패널 ──────── -->
    <section class="panel panel-content" id="panelContent">
      <div class="panel-header">
        <span class="panel-header-icon">📄</span>
        <span class="panel-header-title">문서 원문</span>
      </div>
      <div class="panel-body" id="contentBody">
        <!-- 초기 상태: 드롭존 -->
        <div class="dropzone" id="dropzone">
          <div class="dropzone-inner">
            <div class="dropzone-icon">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <p class="dropzone-title">파일을 여기에 드래그 & 드롭</p>
            <p class="dropzone-subtitle">PDF, DOCX, HWPX, MD, TXT 파일 지원</p>
            <label class="dropzone-browse-btn" for="fileInput">
              또는 파일 선택
            </label>
            <input type="file" id="fileInput"
                   accept=".pdf,.docx,.hwpx,.md,.txt,.markdown"
                   style="display:none;">
          </div>
        </div>
        <!-- 파싱 후 렌더링 영역 -->
        <div class="content-rendered" id="contentRendered" style="display:none;"></div>
      </div>
    </section>

    <!-- 중-우 리사이저 -->
    <div class="resizer resizer-right" id="resizerRight" title="드래그하여 크기 조정"></div>

    <!-- ──────── 우측: 판례 상세 패널 ──────── -->
    <aside class="panel panel-detail" id="panelDetail">
      <div class="panel-header">
        <span class="panel-header-icon">⚖️</span>
        <span class="panel-header-title">판례 상세</span>
      </div>
      <div class="panel-body" id="detailBody">
        <p class="panel-placeholder">사건번호를 클릭하면<br>판례 내용이 표시됩니다.</p>
      </div>
    </aside>

  </main>

  <!-- 전체 화면 드래그 오버레이 (파일 드래그 시 표시) -->
  <div class="drag-overlay" id="dragOverlay">
    <div class="drag-overlay-inner">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>파일을 여기에 놓으세요</p>
    </div>
  </div>

  <script src="lib/pdf.min.js"></script>
  <script src="lib/mammoth.browser.min.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="lib/marked.min.js"></script>

  <!-- 파서 및 확장프로그램 코어 모듈 -->
  <script src="../content/case-regex.js"></script>
  <script src="parser.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
